# ByteHub — production-shaped stack.
#
# Three services: MongoDB, the catalog API, and the storefront. Mongo is
# internal only; the API is bound to loopback so the storefront build can reach
# it; the storefront is the one thing published normally. The API's admin routes
# are not mounted at all, which is what makes the loopback binding harmless.
#
# Order matters. The storefront pre-renders every product page at build time,
# so the catalog has to exist and the API has to be reachable *before* that
# image is built — `up -d --build` in one shot would build the shop against an
# empty database and produce a site with no products.
#
#   cp .env.production.example .env
#   docker compose up -d mongo api
#   docker compose run --rm api npm run catalog -- --commit
#   docker compose run --rm api npm run publish -- --commit
#   docker compose build storefront      # reads the catalog over loopback
#   docker compose up -d storefront

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: bytehub
    networks: [bytehub]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Not published to the host: nothing outside this network needs it.
    expose:
      - '27017'

  api:
    build: .
    restart: unless-stopped
    networks: [bytehub]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      MONGODB_URI: mongodb://mongo:27017/bytehub
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      # Back-office routes stay unmounted. Catalog changes go through the CLI
      # (`docker compose run --rm api npm run catalog -- --commit`).
      ENABLE_ADMIN_API: 'false'
      # Empty: the storefront proxies the API, so the browser never makes a
      # cross-origin request. Set only if the shop and API differ by host.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      USD_TO_EGP_RATE: ${USD_TO_EGP_RATE:-48.5}
    volumes:
      # Photos are read from disk, so new ones need no image rebuild.
      - ./New Catalog:/app/New Catalog:ro
    # Loopback only — not reachable from another machine. It is bound at all
    # because the storefront image is built against it: BuildKit will not join
    # a named compose network, so the build runs on the host's network stack
    # and reaches the API the one way that is available there.
    ports:
      - '127.0.0.1:4000:4000'

  storefront:
    build:
      context: ./apps/storefront
      # BuildKit only accepts default/none/host for a build's network, never a
      # named compose network, so the build runs on the host's stack and talks
      # to the API through the loopback port the api service publishes. That
      # port exists by the time this runs because the storefront is built after
      # `up -d mongo api`, not alongside it.
      network: host
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:?SITE_URL is required}
        # Where *this build* reads the catalog from. Server-side only, and
        # overridden at runtime by the service environment below.
        API_ORIGIN: http://127.0.0.1:4000
        # Baked into the rewrite table at build time, so it has to be the name
        # the running container will use — not the one the builder used.
        NEXT_PUBLIC_API_ORIGIN: http://api:4000
        NEXT_PUBLIC_WHATSAPP: ${WHATSAPP:-201044100855}
        NEXT_PUBLIC_PHONE: ${PHONE:-+20 10 4410 0855}
        NEXT_PUBLIC_EMAIL: ${EMAIL:-hello@bytehub.eg}
        NEXT_PUBLIC_ADDRESS: ${ADDRESS:-Cairo, Egypt}
    restart: unless-stopped
    networks: [bytehub]
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: '3001'
      HOSTNAME: '0.0.0.0'
      # Server-side fetches resolve over the internal network, so the API is
      # never addressed from the browser. The rewrite proxy needs no variable:
      # its destination was baked into the route manifest at build time.
      API_ORIGIN: http://api:4000
    # SHOP_PORT, not PORT: the backend uses PORT for its own listen port, and
    # compose reads the same .env, so a generic name here publishes the shop on
    # whatever port the API happens to be configured with.
    ports:
      - '${SHOP_PORT:-3001}:3001'

networks:
  # Named explicitly rather than relying on `default`, so the storefront build
  # has a stable network to join.
  bytehub:
    name: bytehub

volumes:
  mongo-data:
